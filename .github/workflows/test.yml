name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r browser-bridge/requirements.txt
      - run: python -m unittest discover -s browser-bridge/test -p 'test_*.py'
      - run: python tools/run-browser-tests.py
  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools/check-powershell.ps1
